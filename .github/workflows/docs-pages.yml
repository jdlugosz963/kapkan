name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/frontend/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: site/frontend
        run: npm ci
      - name: Build static documentation
        working-directory: site/frontend
        env:
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build && npm run check-links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4